<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BookingLog Admin</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f24; --muted: #667080;
    --line: #dfe3e8; --accent: #2f5bd3; --accent-text: #ffffff;
    --ok: #1f8a4c; --ok-bg: #e6f4ec; --bad: #c4362c; --bad-bg: #fbeaea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --card: #1b1e24; --text: #e8eaed; --muted: #9aa3ae;
      --line: #2c313a; --accent: #6b8ff0; --accent-text: #0e1116;
      --ok: #5cc98a; --ok-bg: #16281e; --bad: #ef7a70; --bad-bg: #2d1a19;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%; padding: 9px 11px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
  }
  button.ghost { background: transparent; color: var(--text); border-color: var(--line); font-weight: 500; }
  button.small { padding: 5px 10px; font-size: 13px; }
  button:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-top: 14px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; white-space: pre-line; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .hidden { display: none !important; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .pill.on { background: var(--ok-bg); color: var(--ok); }
  .pill.off { background: var(--bad-bg); color: var(--bad); }
  .actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 12px 0; }
  .table-wrap { overflow-x: auto; }
  @media (max-width: 600px) {
    thead { display: none; }
    tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); }
    td { display: flex; justify-content: space-between; border: 0; padding: 4px 0; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 13px; }
    .actions { justify-content: flex-end; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>BookingLog Admin</h1>
    <button id="logout" class="ghost small hidden" type="button">Forget key</button>
  </header>

  <!-- Admin key -->
  <section id="login" class="card">
    <h2>Enter admin key</h2>
    <form id="login-form">
      <label for="key">ADMIN_API_KEY (from Railway → Variables)</label>
      <input id="key" type="password" autocomplete="current-password" required>
      <div class="row"><button type="submit">Unlock</button></div>
      <div id="login-msg" class="msg bad hidden"></div>
    </form>
  </section>

  <div id="app" class="hidden">
    <!-- Create company -->
    <section class="card">
      <h2>New company + owner login</h2>
      <form id="create-form">
        <div class="grid">
          <div><label for="c-name">Company name</label><input id="c-name" required></div>
          <div><label for="o-name">Owner name</label><input id="o-name" required></div>
          <div><label for="o-phone">Owner mobile (login)</label><input id="o-phone" inputmode="tel" required placeholder="9876543210"></div>
          <div><label for="o-pass">Password (min 6)</label><input id="o-pass" type="text" minlength="6" required autocomplete="off"></div>
        </div>
        <div class="row"><button type="submit">Create company</button></div>
        <div id="create-msg" class="msg hidden"></div>
      </form>
    </section>

    <!-- Companies -->
    <section class="card">
      <div class="row" style="margin:0 0 10px;justify-content:space-between;align-items:center">
        <h2 style="margin:0">Companies</h2>
        <button id="refresh" class="ghost small" type="button">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Status</th><th>Members</th><th>Trips</th><th>Created</th><th></th></tr></thead>
          <tbody id="companies"></tbody>
        </table>
      </div>
      <div id="list-msg" class="msg hidden"></div>
    </section>

    <!-- Holidays -->
    <section class="card">
      <h2>Public holidays</h2>
      <div class="grid">
        <div><label for="h-state">State</label><input id="h-state" value="Kerala"></div>
        <div><label for="h-year">Year</label><input id="h-year" type="number" min="2000" max="2100"></div>
      </div>
      <div class="row"><button id="h-load" class="ghost" type="button">Show holidays</button></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Name</th><th></th></tr></thead>
          <tbody id="holidays"></tbody>
        </table>
      </div>
      <form id="h-form">
        <div class="grid" style="margin-top:14px">
          <div><label for="h-date">Date</label><input id="h-date" type="date" required></div>
          <div><label for="h-name">Holiday name</label><input id="h-name" required></div>
        </div>
        <div class="row"><button type="submit">Add / rename holiday</button></div>
      </form>
      <div id="h-msg" class="msg hidden"></div>
    </section>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const KEY_STORE = 'bookinglog-admin-key';
  let adminKey = '';
  try { adminKey = sessionStorage.getItem(KEY_STORE) || ''; } catch {}

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

  const show = (el, text, kind) => {
    el.textContent = text;
    el.className = 'msg ' + (kind || '');
  };
  const hide = el => el.classList.add('hidden');

  /** Call an /admin route. Throws an Error with a readable message on failure. */
  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: {'content-type': 'application/json', 'x-admin-key': adminKey},
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const err = data?.error;
      let msg = err?.message || `Request failed (${res.status})`;
      if (Array.isArray(err?.details)) {
        msg += '\n' + err.details.map(d => `• ${d.field ? d.field + ': ' : ''}${d.message}`).join('\n');
      }
      const e = new Error(msg);
      e.status = res.status;
      throw e;
    }
    return data;
  }

  function lock(message) {
    adminKey = '';
    try { sessionStorage.removeItem(KEY_STORE); } catch {}
    $('app').classList.add('hidden');
    $('logout').classList.add('hidden');
    $('login').classList.remove('hidden');
    if (message) show($('login-msg'), message, 'bad'); else hide($('login-msg'));
  }

  async function unlock() {
    try {
      await loadCompanies();
    } catch (e) {
      lock(e.status === 401 ? 'That admin key is not correct.' : e.message);
      return;
    }
    try { sessionStorage.setItem(KEY_STORE, adminKey); } catch {}
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('logout').classList.remove('hidden');
  }

  /* ------------------------------ companies ------------------------------ */

  async function loadCompanies() {
    const rows = await api('GET', '/admin/companies');
    const body = $('companies');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="6" class="empty">No companies yet. Create one above.</td></tr>';
      return;
    }
    body.innerHTML = rows.map(c => `
      <tr>
        <td data-label="Name"><strong>${esc(c.name)}</strong></td>
        <td data-label="Status"><span class="pill ${c.active ? 'on' : 'off'}">${c.active ? 'Active' : 'Suspended'}</span></td>
        <td data-label="Members" class="num">${c.members}</td>
        <td data-label="Trips" class="num">${c.trips}</td>
        <td data-label="Created" class="muted">${new Date(c.created_at).toLocaleDateString()}</td>
        <td><div class="actions">
          <button class="ghost small" data-act="rename" data-id="${esc(c.id)}" data-name="${esc(c.name)}">Rename</button>
          <button class="ghost small" data-act="toggle" data-id="${esc(c.id)}" data-active="${c.active}">${c.active ? 'Suspend' : 'Restore'}</button>
        </div></td>
      </tr>`).join('');
  }

  $('companies').addEventListener('click', async ev => {
    const btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    const msg = $('list-msg');
    let patch;
    if (btn.dataset.act === 'rename') {
      const name = prompt('New company name', btn.dataset.name);
      if (!name || !name.trim()) return;
      patch = {name: name.trim()};
    } else {
      const active = btn.dataset.active === 'true';
      if (active && !confirm('Suspend this company? Its users will not be able to use the app.')) return;
      patch = {active: !active};
    }
    btn.disabled = true;
    try {
      await api('PATCH', `/admin/companies/${btn.dataset.id}`, patch);
      hide(msg);
      await loadCompanies();
    } catch (e) {
      show(msg, e.message, 'bad');
      btn.disabled = false;
    }
  });

  $('create-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = ev.submitter;
    const msg = $('create-msg');
    btn.disabled = true;
    try {
      const out = await api('POST', '/admin/companies', {
        name: $('c-name').value,
        owner: {name: $('o-name').value, phone: $('o-phone').value, password: $('o-pass').value},
      });
      show(msg, `Created “${out.company.name}”. Owner ${out.owner.name} can now log in with ${out.owner.phone} and the password you entered.`, 'ok');
      ev.target.reset();
      await loadCompanies();
    } catch (e) {
      show(msg, e.message, 'bad');
    } finally {
      btn.disabled = false;
    }
  });

  $('refresh').addEventListener('click', () => loadCompanies().catch(e => show($('list-msg'), e.message, 'bad')));

  /* ------------------------------- holidays ------------------------------- */

  $('h-year').value = new Date().getFullYear();

  async function loadHolidays() {
    const state = $('h-state').value.trim() || 'Kerala';
    const year = $('h-year').value;
    const res = await fetch(`/holidays?year=${encodeURIComponent(year)}&state=${encodeURIComponent(state)}`);
    const rows = await res.json();
    if (!res.ok) throw new Error(rows?.error?.message || 'Could not load holidays');
    const body = $('holidays');
    body.innerHTML = rows.length ? rows.map(h => {
      const date = String(h.date).slice(0, 10);
      return `<tr>
        <td data-label="Date" class="num">${esc(date)}</td>
        <td data-label="Name">${esc(h.name)}</td>
        <td><div class="actions"><button class="ghost small" data-date="${esc(date)}">Delete</button></div></td>
      </tr>`;
    }).join('') : `<tr><td colspan="3" class="empty">No holidays saved for ${esc(state)} ${esc(year)}.</td></tr>`;
  }

  $('h-load').addEventListener('click', () => loadHolidays().then(() => hide($('h-msg'))).catch(e => show($('h-msg'), e.message, 'bad')));

  $('holidays').addEventListener('click', async ev => {
    const btn = ev.target.closest('button[data-date]');
    if (!btn || !confirm(`Delete the holiday on ${btn.dataset.date}?`)) return;
    const state = $('h-state').value.trim() || 'Kerala';
    try {
      await api('DELETE', `/admin/holidays/${btn.dataset.date}?state=${encodeURIComponent(state)}`);
      await loadHolidays();
    } catch (e) {
      show($('h-msg'), e.message, 'bad');
    }
  });

  $('h-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = ev.submitter;
    btn.disabled = true;
    try {
      await api('PUT', '/admin/holidays', {
        state: $('h-state').value.trim() || 'Kerala',
        holidays: [{date: $('h-date').value, name: $('h-name').value}],
      });
      $('h-year').value = $('h-date').value.slice(0, 4);
      ev.target.reset();
      show($('h-msg'), 'Saved.', 'ok');
      await loadHolidays();
    } catch (e) {
      show($('h-msg'), e.message, 'bad');
    } finally {
      btn.disabled = false;
    }
  });

  /* -------------------------------- start --------------------------------- */

  $('login-form').addEventListener('submit', ev => {
    ev.preventDefault();
    adminKey = $('key').value.trim();
    $('key').value = '';
    unlock();
  });
  $('logout').addEventListener('click', () => lock());

  if (adminKey) unlock();
</script>
</body>
</html>
